// edges carry the actual dependency story, not decoration
const EDGES = [

const REVEAL = { foundation: 0.08, computing: 0.18, data: 0.28, ml: 0.38, bridge: 0.48 };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    ["rootRef","hostRef","nodeRef","linkRef","svgRef","gridRef","gridGRef","packetRef","coreRef",
     "ring1Ref","ring2Ref","tipRef","phaseRef","legendRef"].forEach(k => { this[k] = React.createRef(); });
    this.m = { x: 0, y: 0, tx: 0, ty: 0 };
    this.focus = null;
    this.tipNode = null;
    this.p = 0;
  }

  renderVals() {
    return { rootRef: this.rootRef, hostRef: this.hostRef, nodeRef: this.nodeRef, linkRef: this.linkRef,
             svgRef: this.svgRef, gridRef: this.gridRef, gridGRef: this.gridGRef, packetRef: this.packetRef,
             coreRef: this.coreRef, ring1Ref: this.ring1Ref, ring2Ref: this.ring2Ref, tipRef: this.tipRef,
             phaseRef: this.phaseRef, legendRef: this.legendRef };
  }

  componentDidMount() {
    const host = this.hostRef.current;
    if (!host) return;
    this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.small = window.matchMedia("(max-width: 860px)").matches;
    this.tiny = window.matchMedia("(max-width: 700px)").matches;
    this.buildGraph();
    this.buildNodes();
    this.buildLinks();
    this.buildGrid();
    this.wire();
    this.measure();
    this.frame();
    this.start();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("pointermove", this.onMove);
    window.removeEventListener("resize", this.onResize);
    if (this.io) this.io.disconnect();
  }

  buildGraph() {
    this.pos = { core: { x: 0, y: 0.02, z: 0, lay: "foundation" } };
    NODES.forEach(n => { this.pos[n.id] = n; });
    this.adj = {};
    EDGES.forEach(([a, b]) => {
      (this.adj[a] = this.adj[a] || []).push(b);
      (this.adj[b] = this.adj[b] || []).push(a);
    });
  }

  buildNodes() {
    const nl = this.nodeRef.current;
    this.nodes = NODES.map(n => {
      const el = document.createElement("button");
      el.type = "button";
      const primary = !!n.pri;
      if (primary && this.tiny) {
        // compact anchor: label only, so five of them fit a phone without touching
        el.innerHTML = '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(248,251,246,0.96);white-space:nowrap">' + n.l + '</span>';
        el.style.cssText = "position:absolute;left:0;top:0;padding:7px 10px;border:0;border-radius:9px;" +
          "background:linear-gradient(180deg,rgba(30,37,44,0.94),rgba(14,19,25,0.96));" +
          "box-shadow:0 1px 0 rgba(255,255,255,0.13) inset,0 0 0 1px rgba(216,228,232,0.15),0 20px 30px -22px rgba(0,0,0,0.95);" +
          "cursor:pointer;opacity:0;transition:opacity .9s ease,box-shadow .45s ease;will-change:transform";
      } else if (primary) {
        el.innerHTML = MOTIF[n.id] +
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,242,233,0.96)">' + n.l + '</span>';
        el.style.cssText = "position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start;" +
          "padding:14px 16px;border:0;border-radius:13px;background:linear-gradient(180deg,rgba(33,40,47,0.93),rgba(16,21,27,0.95));" +
          "box-shadow:0 1px 0 rgba(255,255,255,0.15) inset,0 -1px 0 rgba(0,0,0,0.4) inset,0 0 0 1px rgba(216,228,232,0.13),0 32px 48px -28px rgba(0,0,0,0.95);" +
          "cursor:pointer;opacity:0;transition:opacity .9s ease,box-shadow .45s ease;will-change:transform";
      } else if (this.tiny) {
        // on a phone the secondary layer stays as depth markers; tap reveals the subject
        el.style.cssText = "position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;padding:0;border:0;border-radius:50%;" +
          "background:rgba(226,238,242,0.72);box-shadow:0 0 0 1px rgba(216,228,232,0.2);cursor:pointer;opacity:0;transition:opacity .9s ease,box-shadow .4s ease";
      } else if (this.tiny) {
        el.innerHTML = '<span style="display:block;width:8px;height:8px;border-radius:50%;background:rgba(226,238,242,0.8);box-shadow:0 0 0 3px rgba(9,14,19,0.6)"></span>';
        el.style.cssText = "position:absolute;left:0;top:0;padding:0;border:0;background:none;cursor:pointer;opacity:0;" +
          "transition:opacity .9s ease;will-change:transform";
      } else {
        // secondaries: a real instrument plate with the motif always legible and a label
        // at readable size — the previous dot-and-name version lost the drawings entirely
        el.innerHTML = '<span data-motif="1" style="display:block;line-height:0;padding:1px 0 2px">' +
            '<svg width="66" height="38" viewBox="0 0 48 28" fill="none" aria-hidden="true">' + (G[n.g] || "") + '</svg></span>' +
          '<span data-name="1" style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(244,249,244,0.92);white-space:nowrap;transition:color .4s ease">' + n.l + '</span>';
        el.style.cssText = "position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;" +
          "padding:10px 12px;border:0;border-radius:11px;background:linear-gradient(180deg,rgba(28,35,42,0.9),rgba(13,18,24,0.93));" +
          "box-shadow:0 1px 0 rgba(255,255,255,0.12) inset,0 -1px 0 rgba(0,0,0,0.42) inset,0 0 0 1px rgba(216,228,232,0.14),0 24px 36px -24px rgba(0,0,0,0.95);" +
          "cursor:pointer;opacity:0;transition:opacity .9s ease,box-shadow .45s ease,background .4s ease;will-change:transform";
      }
      const node = { def: n, el: el, shown: 0, scr: { x: 0, y: 0, k: 1 }, primary: primary, base: el.style.boxShadow };
      el.addEventListener("pointerenter", () => this.setFocus(n.id));
      el.addEventListener("focus", () => this.setFocus(n.id));
      el.addEventListener("pointerleave", () => this.setFocus(null));
      el.addEventListener("blur", () => this.setFocus(null));
      el.addEventListener("click", () => this.setFocus(this.focus === n.id ? null : n.id));
      nl.appendChild(el);
      return node;
    });
    this.byId = {};
    this.nodes.forEach(n => { this.byId[n.def.id] = n; });
  }

  buildLinks() {
    const g = this.linkRef.current;
    this.links = EDGES.map(([a, b]) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
      g.appendChild(el);
      const bridge = (this.pos[a].lay === "bridge") || (this.pos[b].lay === "bridge");
      return { a: a, b: b, id: a + "-" + b, el: el, g: 0, gt: 0, bridge: bridge };
    });
    this.byLink = {};
    this.links.forEach(l => { this.byLink[l.id] = l; });

    const layer = this.packetRef.current;
    this.packets = FLOW.map((id, i) => {
      const l = this.byLink[id];
      if (!l) return null;
      const d = document.createElement("div");
      d.style.cssText = "position:absolute;left:0;top:0;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;" +
        "background:#f2ece0;opacity:0;will-change:transform";
      layer.appendChild(d);
      return { el: d, link: l, speed: 0.13 + (i % 5) * 0.015, phase: (i * 0.37) % 1, warm: id.indexOf("ml") >= 0 };
    }).filter(Boolean);
  }

  buildGrid() {
    // a faint floor plane, so the depth has something to be measured against
    const g = this.gridGRef.current;
    this.gridLines = [];
    for (let i = 0; i <= 6; i++) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
      g.appendChild(el);
      this.gridLines.push({ el: el, u: -1 + i * (2 / 6), dir: "v" });
    }
    for (let i = 0; i <= 4; i++) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
      g.appendChild(el);
      this.gridLines.push({ el: el, u: -1 + i * (2 / 4), dir: "h" });
    }
  }

  wire() {
    this.legends = [...this.rootRef.current.querySelectorAll("[data-legend]")];
    this.legends.forEach(b => {
      b.addEventListener("pointerenter", () => this.setFocus(b.dataset.legend));
      b.addEventListener("focus", () => this.setFocus(b.dataset.legend));
      b.addEventListener("pointerleave", () => this.setFocus(null));
      b.addEventListener("click", () => this.setFocus(this.focus === b.dataset.legend ? null : b.dataset.legend));
    });
    this.layerRows = {};
    [...this.legendRef.current.querySelectorAll("[data-layer-row]")].forEach(el => { this.layerRows[el.dataset.layerRow] = el; });
    this.reveals = [...this.rootRef.current.querySelectorAll("[data-edu-rev]")];

    this.onScroll = () => {
      const r = this.hostRef.current.getBoundingClientRect();
      const vh = window.innerHeight;
      // reaches 1 as the section settles into frame, not as it leaves
      this.p = Math.min(1, Math.max(0, (vh * 0.94 - r.top) / (r.height * 0.5 + vh * 0.36)));
      this.reveals.forEach((el, i) => {
        if (this.p > 0.02 + i * 0.03) { el.style.opacity = "1"; el.style.transform = "none"; }
      });
      // scroll always drives a frame: the ambient loop only adds drift on top
      this.frame();
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onScroll();

    this.onMove = (e) => {
      if (this.reduced || this.small) return;
      const r = this.hostRef.current.getBoundingClientRect();
      this.m.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      this.m.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    window.addEventListener("pointermove", this.onMove, { passive: true });
  }

  measure() {
    const host = this.hostRef.current;
    this.W = host.clientWidth || 1;
    this.H = host.clientHeight || 1;
    [this.svgRef.current, this.gridRef.current].forEach(s => {
      if (s) s.setAttribute("viewBox", "0 0 " + this.W + " " + this.H);
    });
  }

  // hovering a subject lights the subjects it actually depends on
  setFocus(id) {
    this.focus = id;
    const near = id ? new Set([id].concat(this.adj[id] || [])) : null;
    this.nodes.forEach(n => {
      const on = !near || near.has(n.def.id);
      n.dim = on ? 1 : 0.14;
      n.lead = id === n.def.id;
      n.el.style.boxShadow = n.base + (n.lead ? ", 0 0 0 2px rgba(226,178,116,0.5)" : "");
      if (!n.primary) {
        const name = n.el.querySelector("[data-name]");
        if (name) name.style.color = n.lead ? "rgba(252,253,250,1)" : "rgba(244,249,244,0.92)";
        n.el.style.background = n.lead
          ? "linear-gradient(180deg,rgba(42,50,58,0.95),rgba(18,24,31,0.96))"
          : "linear-gradient(180deg,rgba(28,35,42,0.9),rgba(13,18,24,0.93))";
      }
    });
    this.links.forEach(l => { l.hot = !!id && (l.a === id || l.b === id); l.cold = !!id && !l.hot; });
    this.legends.forEach(b => {
      const on = b.dataset.legend === id;
      const meta = b.querySelector("[data-legend-meta]");
      if (meta) meta.style.opacity = on ? "1" : "0";
      b.style.opacity = !id || on ? "1" : "0.45";
      const key = b.querySelector("[data-edu-key]");
      if (key) key.style.width = on ? "100%" : "0";
    });
    const tip = this.tipRef.current;
    const n = id ? this.byId[id] : null;
    if (tip) {
      if (n && n.shown > 0.4) {
        this.tipNode = id;
        tip.textContent = n.def.tip;
        tip.style.opacity = "1";
      } else {
        this.tipNode = null;
        tip.style.opacity = "0";
      }
    }
  }

  // ── projection ────────────────────────────────────────────────────────────
  frame() {
    const t = performance.now() / 1000;
    const W = this.W, H = this.H, p = this.p;
    if (!W) return;
    this.m.x += (this.m.tx - this.m.x) * 0.04;
    this.m.y += (this.m.ty - this.m.y) * 0.04;

    const settle = 1 - Math.min(1, p / 0.3);
    const yaw = Math.sin(t * 0.085) * 0.10 + this.m.x * 0.13 - settle * 0.10;
    const pitch = Math.sin(t * 0.063 + 1.1) * 0.04 + this.m.y * 0.055 + settle * 0.06;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const F = 2.15, SX = W * 0.345, SY = H * 0.36;
    const cam = (x, y, z) => {
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      const k = F / (F + z2);
      return { x: W / 2 + x1 * k * SX, y: H / 2 + y1 * k * SY, k: k, z: z2 };
    };
    this.cam = cam;

    // layers arrive in order as the section is read
    let phase = "Foundation";
    LAYERS.forEach(lay => {
      const at = REVEAL[lay];
      if (p >= at) phase = PHASE[lay];
      const row = this.layerRows[lay];
      if (row) row.style.opacity = p >= at ? (PHASE[lay] === phase ? "1" : "0.62") : "0.3";
    });
    if (this.coreRef.current) this.coreRef.current.style.opacity = p >= 0.2 ? "1" : "0";
    // fall back to the container itself, so a missing inner span can never freeze the readout
    const pr = this.phaseRef.current;
    const ph = pr && (pr.querySelector("[data-phase-name]") || pr);
    // the indicator names the layer currently assembling, never the legend's own wording
    const shown = phase === "Where it is heading" ? "AI systems" : phase;
    if (ph && ph.textContent !== shown) ph.textContent = shown;

    this.nodes.forEach((n, i) => {
      const at = REVEAL[n.def.lay] + (i % 4) * 0.012;
      const tgt = p >= at ? 1 : 0;
      n.shown += (tgt - n.shown) * 0.08;
      const d = n.def;
      const s = cam(d.x, d.y, d.z);
      n.scr = s;
      const depth = 0.62 + 0.38 * Math.min(1, Math.max(0, (s.k - 0.62) / 0.45));
      const base = d.lay === "bridge" ? 0.78 : 1;
      // scale floor keeps far labels readable instead of shrinking them into noise
      const sc = Math.max(0.82, Math.min(1.08, 0.92 + (s.k - 1) * 0.55));
      n.el.style.transform = "translate(-50%,-50%) translate(" + s.x.toFixed(1) + "px," + s.y.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
      n.el.style.zIndex = String(Math.round(200 - s.z * 100) + (n.primary ? 30 : 0));
      n.want = n.shown * depth * base * (n.dim === undefined ? 1 : n.dim);
      // a phone cannot hold nineteen plates without collisions: the five anchors carry the
      // story there, the rest stay as quiet depth markers
      if (this.tiny && !n.primary) n.want *= n.lead ? 1 : 0.34;
      n.el.style.pointerEvents = n.shown > 0.5 ? "auto" : "none";
    });

    // screen-space de-collide: the camera drifts, so overlap has to be resolved per frame.
    // Nearer / primary / focused labels win; the loser fades to its marker.
    const order = this.nodes.slice().sort((a, b) => {
      const rank = (n) => (n.lead ? 3 : 0) + (n.primary ? 2 : 0) + n.scr.k;
      return rank(b) - rank(a);
    });
    const taken = [];
    order.forEach(n => {
      const w = (this.tiny ? (n.primary ? 108 : 14) : (n.primary ? 140 : 116)) * n.scr.k;
      const h = (this.tiny ? (n.primary ? 28 : 14) : (n.primary ? 82 : 66)) * n.scr.k;
      const box = { l: n.scr.x - w / 2, r: n.scr.x + w / 2, t: n.scr.y - h / 2, b: n.scr.y + h / 2 };
      const hit = taken.some(o => box.l < o.r - 4 && box.r > o.l + 4 && box.t < o.b - 2 && box.b > o.t + 2);
      if (hit && !n.lead) {
        // the loser recedes rather than stacking; primaries never fully drop out
        n.want *= n.primary ? 0.5 : 0.12;
        n.el.style.pointerEvents = "none";
      } else {
        taken.push(box);
      }
      n.el.style.opacity = n.want.toFixed(3);
    });

    const core = this.coreRef.current;
    if (core) {
      const s = cam(0, 0.02, 0);
      core.style.transform = "translate(" + s.x.toFixed(1) + "px," + s.y.toFixed(1) + "px) scale(" + s.k.toFixed(3) + ")";
      const r1 = this.ring1Ref.current, r2 = this.ring2Ref.current;
      if (r1) r1.style.transform = "rotate(" + (t * 9).toFixed(1) + "deg) scaleY(" + (0.34 + 0.1 * Math.sin(t * 0.3)).toFixed(3) + ")";
      if (r2) r2.style.transform = "rotate(" + (-t * 6).toFixed(1) + "deg) scaleX(" + (0.4 + 0.12 * Math.cos(t * 0.26)).toFixed(3) + ")";
    }

    // links are rebuilt every other frame: plenty for lines, half the string work
    this.tick = (this.tick || 0) + 1;
    if (this.tick % 2 === 1) this.drawLinks(p);

    this.drawGrid();
    this.drawPackets(t);

    const tip = this.tipRef.current;
    if (tip && this.tipNode) {
      const n = this.byId[this.tipNode];
      if (n) {
        tip.style.left = n.scr.x.toFixed(1) + "px";
        tip.style.top = (n.scr.y - (n.primary ? 52 : 26) * n.scr.k).toFixed(1) + "px";
      }
    }
  }

  drawLinks(p) {
    const SAMP = 9;
    this.links.forEach(l => {
      const A = this.pos[l.a], B = this.pos[l.b];
      const ready = p >= Math.max(REVEAL[A.lay], REVEAL[B.lay]) + 0.02;
      l.gt = ready ? 1 : 0;
      l.g += (l.gt - l.g) * 0.05;
      if (l.g < 0.02) { if (l.el.getAttribute("d")) l.el.setAttribute("d", ""); return; }
      // every edge bows away from the core plane so the field reads as a shell, not a web
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, mz = (A.z + B.z) / 2;
      const bow = 0.16 + Math.abs(A.x - B.x) * 0.1;
      const cx = mx * (1 - 0.12), cyy = my * (1 - 0.12), cz = mz - bow;
      let d = "";
      const n = Math.max(2, Math.round(SAMP * l.g));
      for (let i = 0; i <= n; i++) {
        const u = (i / n) * l.g, m1 = 1 - u;
        const s = this.cam(
          m1 * m1 * A.x + 2 * m1 * u * cx + u * u * B.x,
          m1 * m1 * A.y + 2 * m1 * u * cyy + u * u * B.y,
          m1 * m1 * A.z + 2 * m1 * u * cz + u * u * B.z
        );
        d += (i ? "L" : "M") + s.x.toFixed(1) + " " + s.y.toFixed(1);
      }
      l.el.setAttribute("d", d);
      const mid = this.cam(cx, cyy, cz);
      const fade = 0.35 + 0.65 * Math.min(1, Math.max(0, (mid.k - 0.78) / 0.4));
      const warm = l.a === "core" || l.b === "core" || l.a === "ml" || l.b === "ml";
      // resting lines stay quiet so 30-odd edges never fuzz into a mesh
      let a = (l.bridge ? 0.14 : warm ? 0.28 : 0.17) * fade;
      if (l.hot) a = 0.95 * fade;
      if (l.cold) a *= 0.18;
      l.el.setAttribute("stroke", (warm || l.hot) ? "rgba(226,178,116," + a.toFixed(3) + ")" : "rgba(216,228,232," + a.toFixed(3) + ")");
      l.el.setAttribute("stroke-width", ((l.hot ? 1.7 : l.bridge ? 0.9 : 1.2) * mid.k).toFixed(2));
      if (l.bridge) l.el.setAttribute("stroke-dasharray", "3 5");
    });
  }

  drawGrid() {
    this.gridLines.forEach(g => {
      let d = "";
      for (let i = 0; i <= 4; i++) {
        const v = -1 + i * 0.5;
        const s = g.dir === "v" ? this.cam(g.u, 0.98, v * 0.9) : this.cam(v, 0.98, g.u * 0.9);
        d += (i ? "L" : "M") + s.x.toFixed(1) + " " + s.y.toFixed(1);
      }
      g.el.setAttribute("d", d);
    });
  }

  drawPackets(t) {
    const rate = this.props.flowRate ?? 1;
    this.packets.forEach(k => {
      const l = k.link;
      if (l.g < 0.96) { if (k.el.style.opacity !== "0") k.el.style.opacity = "0"; return; }
      const A = this.pos[l.a], B = this.pos[l.b];
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, mz = (A.z + B.z) / 2;
      const bow = 0.16 + Math.abs(A.x - B.x) * 0.1;
      const cx = mx * 0.88, cyy = my * 0.88, cz = mz - bow;
      const u = ((t * k.speed * rate + k.phase) % 1 + 1) % 1, m1 = 1 - u;
      const s = this.cam(
        m1 * m1 * A.x + 2 * m1 * u * cx + u * u * B.x,
        m1 * m1 * A.y + 2 * m1 * u * cyy + u * u * B.y,
        m1 * m1 * A.z + 2 * m1 * u * cz + u * u * B.z
      );
      const dim = this.focus && !(l.a === this.focus || l.b === this.focus) ? 0.15 : 1;
      k.el.style.transform = "translate3d(" + s.x.toFixed(1) + "px," + s.y.toFixed(1) + "px,0) scale(" + Math.max(0.5, s.k).toFixed(2) + ")";
      k.el.style.opacity = (Math.sin(Math.PI * u) * 0.9 * dim).toFixed(3);
      k.el.style.background = k.warm ? "#e2b274" : "#f2ece0";
    });
  }

  start() {
    this.onResize = () => {
      // an orientation change crosses the breakpoint: the node plates must be rebuilt in the
      // other mode, or a rotated phone keeps the desktop treatment and congests again
      const small = window.matchMedia("(max-width: 860px)").matches;
      const tiny = window.matchMedia("(max-width: 700px)").matches;
      if (tiny !== this.tiny || small !== this.small) {
        this.small = small; this.tiny = tiny;
        const keep = this.nodes.map(n => n.shown);
        this.nodeRef.current.innerHTML = "";
        this.buildNodes();
        this.nodes.forEach((n, i) => { n.shown = keep[i] === undefined ? 1 : keep[i]; });
        this.setFocus(this.focus && this.byId[this.focus] ? this.focus : null);
      }
      this.measure();
      this.frame();
    };
    window.addEventListener("resize", this.onResize);
    this.live = true;
    if ("IntersectionObserver" in window) {
      // never latch off a single stale entry — that froze the whole field mid-build
      this.io = new IntersectionObserver((en) => { this.live = en.some(e => e.isIntersecting); }, { rootMargin: "25% 0px" });
      this.io.observe(this.hostRef.current);
    }
    if (this.reduced) {
      this.p = 1;
      this.nodes.forEach(n => { n.shown = 1; });
      this.links.forEach(l => { l.g = 1; });
      this.frame();
      return;
    }
    const tick = () => { this.raf = requestAnimationFrame(tick); if (this.live) this.frame(); };
    tick();
  }
}
</script>
</body>
</html>
