  /* The degree as a transit map. Each anchor of the field is a line; each subject a
     station on it, placed along the real prerequisites; the lines draw themselves as the
     section arrives and a train runs each one, stopping at every station. */
  [data-legend="math"]  { --ln: #e8ba7c; }
  [data-legend="stats"] { --ln: #9ec4d8; }
  [data-legend="prog"]  { --ln: #a9c49b; }
  [data-legend="ds"]    { --ln: #d9967c; }
  [data-legend="ml"]    { --ln: #efe8da; }
  [data-legend] [data-edu-key] { width: 22px !important; height: 3px !important; top: -2px !important; border-radius: 2px; background: var(--ln) !important; }
  [data-legend]:hover [data-edu-key], [data-legend]:focus-visible [data-edu-key], [data-legend][aria-pressed="true"] [data-edu-key] { width: 100% !important; }
  [data-edu-map] { position: relative; width: 100%; min-width: 0; }
  [data-edu-scroll] { position: relative; width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  [data-edu-scroll]::-webkit-scrollbar { display: none; }
  [data-edu-svg] { display: block; width: 100%; height: auto; min-width: 760px; }
  [data-edu-svg] .ln { transition: opacity .45s ease; }
  [data-edu-svg][data-focus] .ln:not(.on) { opacity: .2; }
  [data-edu-svg][data-focus] .st:not(.on) { opacity: .3; }
  [data-edu-svg] .st { transition: opacity .45s ease; cursor: default; outline: none; }
  [data-edu-svg] .st:focus-visible .ring { stroke: #e8ba7c; }
  [data-edu-svg] .lb { transition: clip-path .5s steps(9, end); }
  [data-edu-tip] { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; max-width: 240px; padding: 9px 12px 8px; border-radius: 8px;
    background: rgba(8,12,16,0.94); box-shadow: 0 0 0 1px rgba(214,230,236,0.16); opacity: 0; transform: translate3d(var(--tx,0), var(--ty,0), 0); transition: opacity .2s ease; }
  [data-edu-tip].on { opacity: 1; }
  [data-edu-tip] b { display: block; font: 500 10px/1.2 'IBM Plex Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #f4efe4; }
  [data-edu-tip] span { display: block; margin-top: 5px; font: 400 13px/1.45 'Instrument Sans', 'Helvetica Neue', sans-serif; color: rgba(240,246,240,0.8); }
  [data-edu-cap] { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .24em; text-transform: uppercase; color: rgba(232,240,232,0.46); }
  [data-edu-swipe] { display: none; }
  @media (max-width: 760px) { [data-edu-swipe] { display: inline; } }
  .edu-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { [data-edu-svg] .lb, [data-edu-svg] .ln, [data-edu-svg] .st { transition: none !important; } }
</style>

<script type="text/x-dc" data-dc-script data-props="{}">
// Stations on a grid (x right, y down, in map units); U px per unit inside the viewBox.
const U = 100, OX = 150, OY = 40;
const ST = {
  math:  { l: "Mathematics",      x: 0,   y: 1,   side: "left",  big: 1, tip: "structure, abstraction, optimization" },
  algo:  { l: "Algorithms",       x: 2.4, y: 1,   side: "above", big: 1, tip: "how decisions scale" },
  opt:   { l: "Optimization",     x: 3.5, y: 1,   side: "above",         tip: "improving under constraints" },
  prog:  { l: "Programming",      x: 0,   y: 2.2, side: "left",  big: 1, tip: "implementation, logic, systems" },
  dstr:  { l: "Data Structures",  x: 1.1, y: 2.2, side: "below",         tip: "how information is organized" },
  csys:  { l: "Computer Systems", x: 3.95,y: 2.2, side: "below",         tip: "how software meets hardware constraints" },
  sysd:  { l: "System Design",    x: 7.6, y: 2.2, side: "above",         tip: "how components operate together" },
  stats: { l: "Statistics",       x: 0,   y: 3.6, side: "left",  big: 1, tip: "uncertainty, inference, evidence" },
  prob:  { l: "Probability",      x: 1.3, y: 3.6, side: "below",         tip: "reasoning when the answer is a distribution" },
  exp:   { l: "Experimentation",  x: 2.65,y: 3.6, side: "below",         tip: "designing tests that can actually be wrong" },
  eval:  { l: "Model Evaluation", x: 4.1, y: 3.6, side: "above",         tip: "measuring what actually works" },
  ml:    { l: "Machine Learning", x: 6.2, y: 3.6, side: "belowRight", big: 1, tip: "models, generalization, evaluation" },
  db:    { l: "Databases",        x: 0,   y: 5,   side: "left",          tip: "storing and retrieving structured knowledge" },
  danal: { l: "Data Analysis",    x: 1.35,y: 5,   side: "below",         tip: "reading what the data is really saying" },
  ds:    { l: "Data Science",     x: 2.8, y: 5,   side: "below", big: 1, tip: "turning data into useful signals" },
  viz:   { l: "Visualization",    x: 4.2, y: 5,   side: "below",         tip: "making a signal legible" },
  dl:    { l: "Deep Learning",    x: 7.0, y: 2.8, side: "above",         tip: "representation learning at depth" },
  inf:   { l: "Inference",        x: 7.7, y: 3.6, side: "above",         tip: "serving models under real constraints" },
  ai:    { l: "AI Systems",       x: 9.4, y: 2.8, side: "right", big: 2, tip: "the direction all of this is pointing", sub: "Where it is heading" }
};
// Lines as waypoints: a station id, or [x, y] for a bend. Runs are 0°, 45° or 90°.
const LINES = [
  { id: "math",  c: "#e8ba7c", w: [0.05, 0.36], pts: ["math", "algo", "opt", [3.6, 1], "ml", "dl", "ai"] },
  { id: "prog",  c: "#a9c49b", w: [0.10, 0.42], pts: ["prog", "dstr", [1.2, 2.2], "algo", [3.6, 2.2], "csys", "sysd", [8.8, 2.2], "ai"] },
  { id: "stats", c: "#9ec4d8", w: [0.16, 0.46], pts: ["stats", "prob", "exp", "eval", "ml"] },
  { id: "ds",    c: "#d9967c", w: [0.26, 0.54], pts: ["db", "danal", "ds", "viz", [4.8, 5], "ml"] },
  { id: "ml",    c: "#efe8da", w: [0.46, 0.66], pts: ["ml", "inf", [8.6, 3.6], "ai"] }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    ["rootRef", "hostRef", "scrollRef", "svgRef", "tipRef", "listRef"].forEach((k) => { this[k] = React.createRef(); });
    this.p = 0; this.pT = 0;
  }
  renderVals() {
    return { rootRef: this.rootRef, hostRef: this.hostRef, scrollRef: this.scrollRef, svgRef: this.svgRef, tipRef: this.tipRef, listRef: this.listRef };
  }

  componentDidMount() {
    const svg = this.svgRef.current;
    if (!svg) return;
    this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const X = (x) => OX + x * U, Y = (y) => OY + y * U;
    const pt = (w) => (typeof w === "string" ? [X(ST[w].x), Y(ST[w].y)] : [X(w[0]), Y(w[1])]);

    // a hairline grid, the only texture
    const grid = mk("g", { stroke: "rgba(214,230,236,0.05)", "stroke-width": 1 }, svg);
    for (let x = 0; x <= 1260; x += 50) mk("line", { x1: x, y1: 0, x2: x, y2: 600 }, grid);
    for (let y = 0; y <= 600; y += 50) mk("line", { x1: 0, y1: y, x2: 1260, y2: y }, grid);

    // lines: a dark casing under each, so a crossing reads as a bridge, not a tangle
    const lg = mk("g", { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
    this.lines = LINES.map((L) => {
      const P = L.pts.map(pt);
      let d = "M" + P[0][0] + " " + P[0][1];
      for (let i = 1; i < P.length; i++) {
        const [x0, y0] = P[i - 1], [x1, y1] = P[i];
        if (i < P.length - 1) {
          const [x2, y2] = P[i + 1];
          const a = Math.hypot(x1 - x0, y1 - y0), b = Math.hypot(x2 - x1, y2 - y1);
          const turn = Math.abs((x1 - x0) * (y2 - y1) - (y1 - y0) * (x2 - x1)) > 1e-6;
          const r = turn ? Math.min(16, a / 2, b / 2) : 0;
          if (r > 0) {
            const ax = x1 - (x1 - x0) / a * r, ay = y1 - (y1 - y0) / a * r;
            const bx = x1 + (x2 - x1) / b * r, by = y1 + (y2 - y1) / b * r;
            d += " L" + ax.toFixed(1) + " " + ay.toFixed(1) + " Q" + x1 + " " + y1 + " " + bx.toFixed(1) + " " + by.toFixed(1);
            continue;
          }
        }
        d += " L" + x1 + " " + y1;
      }
      const g = mk("g", { class: "ln", "data-line": L.id }, lg);
      mk("path", { d, stroke: "#080c10", "stroke-width": 12 }, g);
      const path = mk("path", { d, stroke: L.c, "stroke-width": 6 }, g);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len + " " + len;
      path.style.strokeDashoffset = String(len);
      // where each station sits along this line
      const stops = L.pts.filter((w) => typeof w === "string").map((id) => {
        const [sx, sy] = pt(id);
        let best = 0, bd = 1e9;
        for (let s = 0; s <= len; s += 2) { const q = path.getPointAtLength(s); const dd = (q.x - sx) ** 2 + (q.y - sy) ** 2; if (dd < bd) { bd = dd; best = s; } }
        return { id, s: best };
      });
      const train = mk("rect", { width: 18, height: 8, rx: 4, x: -9, y: -4, fill: L.c, stroke: "#080c10", "stroke-width": 2, opacity: 0 }, svg);
      return Object.assign({}, L, { g, path, len, stops, train, drawn: -1 });
    });

    // stations: rings at interchanges, ticks elsewhere; labels set beside them
    const sg = mk("g", {}, svg);
    this.stations = {};
    const linesAt = {};
    this.lines.forEach((L) => L.stops.forEach((s) => { (linesAt[s.id] = linesAt[s.id] || []).push(L); }));
    Object.keys(ST).forEach((id) => {
      const s = ST[id], [x, y] = pt(id), on = linesAt[id] || [];
      const g = mk("g", { class: "st", "data-st": id, tabindex: 0, role: "img", "aria-label": s.l + ": " + s.tip, opacity: 0 }, sg);
      g.style.transformBox = "fill-box"; g.style.transformOrigin = "center";
      if (s.big || on.length > 1) {
        const r = s.big === 2 ? 13 : 9;
        mk("circle", { class: "ring", cx: x, cy: y, r, fill: "#080c10", stroke: "#efe8da", "stroke-width": s.big === 2 ? 4 : 3 }, g);
        if (s.big === 2) mk("circle", { cx: x, cy: y, r: 4, fill: "#e8ba7c" }, g);
      } else {
        // a tick across the line, on the label's side
        const L = on[0];
        const dy = s.side === "above" ? -1 : 1;
        mk("line", { x1: x, y1: y, x2: x, y2: y + dy * 11, stroke: L ? L.c : "#efe8da", "stroke-width": 5, "stroke-linecap": "butt" }, g);
      }
      const fs = s.big ? 13 : 11.5;
      let tx = x, ty = y, anchor = "middle";
      if (s.side === "left") { tx = x - 20; ty = y + fs * 0.36; anchor = "end"; }
      else if (s.side === "right") { tx = x + 24; ty = y + fs * 0.1; anchor = "start"; }
      else if (s.side === "above") { ty = y - (s.big ? 22 : 20); }
      else if (s.side === "belowRight") { tx = x + 14; ty = y + 30; anchor = "start"; }
      else { ty = y + (s.big ? 30 : 30); }
      const lb = mk("text", { class: "lb", x: tx, y: ty, "text-anchor": anchor, fill: s.big ? "#fbf7ee" : "rgba(236,242,236,0.82)",
        "font-family": "'IBM Plex Mono', monospace", "font-size": fs, "font-weight": s.big ? 500 : 400, "letter-spacing": fs * 0.12 }, g);
      lb.textContent = s.l.toUpperCase();
      if (s.sub) {
        const sub = mk("text", { class: "lb", x: tx, y: ty + 18, "text-anchor": anchor, fill: "rgba(232,186,124,0.95)",
          "font-family": "'IBM Plex Mono', monospace", "font-size": 10, "letter-spacing": 1.4 }, g);
        sub.textContent = s.sub.toUpperCase();
      }
      this.stations[id] = { g, lines: on, shown: false, x, y, s };
      const li = document.createElement("li"); li.textContent = s.l + " — " + s.tip; this.listRef.current.appendChild(li);
    });
    // a station belongs to the earliest point any of its lines reaches it
    Object.keys(this.stations).forEach((id) => {
      const st = this.stations[id];
      st.at = Math.min(...st.lines.map((L) => { const stop = L.stops.find((q) => q.id === id); return L.w[0] + (L.w[1] - L.w[0]) * (stop.s / L.len); }));
    });
    // the terminus, and the lines it is drawn on top of
    sg.parentNode.appendChild(sg);

    this.buildSchedules();
    this.bindFocus();

    const root = this.rootRef.current;
    this.revs = root ? [...root.querySelectorAll("[data-edu-rev]")] : [];
    this.onScroll = () => {
      const r = this.hostRef.current.getBoundingClientRect(), vh = window.innerHeight;
      this.pT = Math.min(1, Math.max(0, (vh * 0.92 - r.top) / (r.height + vh * 0.35)));
      if (r.top < vh * 0.95) this.revs.forEach((el) => { el.style.opacity = "1"; el.style.transform = "none"; });
      if (this.reduced) { this.p = 1; this.frame(performance.now()); }
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onScroll();
    this.live = true;
    if ("IntersectionObserver" in window) {
      this.io = new IntersectionObserver((en) => { this.live = en.some((e) => e.isIntersecting); }, { rootMargin: "20% 0px" });
      this.io.observe(this.hostRef.current);
    }
    this.t0 = performance.now();
    if (this.reduced) { this.p = 1; this.frame(this.t0); return; }
    const tick = (now) => {
      this.raf = requestAnimationFrame(tick);
      if (!this.live) return;
      const d = this.pT - this.p;
      this.p += Math.abs(d) < 0.0005 ? d : d * 0.08;
      this.frame(now);
    };
    this.raf = requestAnimationFrame(tick);
  }

  // A train's day: run between stations at an even speed (eased at each end), stand at
  // each platform, reverse at the terminus. Precomputed per line as a looping timetable.
  buildSchedules() {
    const speed = 150, dwell = 0.7;
    this.lines.forEach((L, k) => {
      const s = L.stops.map((q) => q.s).sort((a, b) => a - b);
      const seq = s.concat(s.slice(1, -1).reverse());
      const legs = []; let t = 0;
      for (let i = 0; i < seq.length; i++) {
        const a = seq[i], b = seq[(i + 1) % seq.length];
        legs.push({ t0: t, t1: t + dwell, a, b: a }); t += dwell;
        const dur = Math.max(0.4, Math.abs(b - a) / speed);
        legs.push({ t0: t, t1: t + dur, a, b }); t += dur;
      }
      L.legs = legs; L.T = t; L.off = k * 2.3;
    });
  }

  frame(now) {
    const p = this.p, t = (now - this.t0) / 1000;
    const ease = (x) => x * x * (3 - 2 * x);
    this.lines.forEach((L) => {
      const f = ease(Math.min(1, Math.max(0, (p - L.w[0]) / (L.w[1] - L.w[0]))));
      const q = Math.round(f * 1000) / 1000;
      if (q !== L.drawn) { L.drawn = q; L.path.style.strokeDashoffset = String(L.len * (1 - q)); }
      // the train runs once its line is complete
      const run = q >= 1 && !this.reduced;
      if (run !== L.running) { L.running = run; L.train.setAttribute("opacity", run ? 1 : 0); }
      if (!run) return;
      const tt = ((t + L.off) % L.T + L.T) % L.T;
      let leg = L.legs[0];
      for (let i = 0; i < L.legs.length; i++) if (tt >= L.legs[i].t0 && tt < L.legs[i].t1) { leg = L.legs[i]; break; }
      const u = ease((tt - leg.t0) / Math.max(1e-6, leg.t1 - leg.t0));
      const s = leg.a + (leg.b - leg.a) * u;
      const a = L.path.getPointAtLength(s), b = L.path.getPointAtLength(Math.min(L.len, s + 1.5)), c = L.path.getPointAtLength(Math.max(0, s - 1.5));
      const ang = Math.atan2(b.y - c.y, b.x - c.x) * 57.2958;
      L.train.setAttribute("transform", "translate(" + a.x.toFixed(1) + " " + a.y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ")");
    });
    Object.keys(this.stations).forEach((id) => {
      const st = this.stations[id], show = p >= st.at - 0.005;
      if (show === st.shown) return;
      st.shown = show;
      st.g.setAttribute("opacity", show ? 1 : 0);
      st.g.querySelectorAll(".lb").forEach((lb) => { lb.style.clipPath = show ? "inset(0 0 0 0)" : "inset(0 100% 0 0)"; });
    });
  }

  // hover, focus or tap: a station lights the lines through it; a legend button, its line
  bindFocus() {
    const svg = this.svgRef.current, tip = this.tipRef.current, host = this.hostRef.current;
    const setLine = (ids, stationIds) => {
      if (!ids) { svg.removeAttribute("data-focus"); } else svg.setAttribute("data-focus", "1");
      this.lines.forEach((L) => L.g.classList.toggle("on", !!ids && ids.includes(L.id)));
      Object.keys(this.stations).forEach((id) => this.stations[id].g.classList.toggle("on", !!stationIds && stationIds.includes(id)));
      (this.legends || []).forEach((b) => b.setAttribute("aria-pressed", ids && ids.length === 1 && ids[0] === b.dataset.legend ? "true" : "false"));
    };
    const showTip = (id) => {
      const st = this.stations[id];
      if (!id || !st) { tip.classList.remove("on"); return; }
      tip.querySelector("b").textContent = st.s.l;
      tip.querySelector("span").textContent = st.s.tip;
      const hr = host.getBoundingClientRect(), gr = st.g.getBoundingClientRect();
      const tw = tip.offsetWidth || 200;
      tip.style.setProperty("--tx", Math.max(0, Math.min(hr.width - tw, gr.left - hr.left + gr.width / 2 - tw / 2)) + "px");
      tip.style.setProperty("--ty", Math.max(0, gr.top - hr.top - (tip.offsetHeight || 56) - 10) + "px");
      tip.classList.add("on");
    };
    const focusStation = (id) => {
      if (!id) { setLine(null); showTip(null); return; }
      const st = this.stations[id];
      const ids = st.lines.map((L) => L.id);
      const near = Object.keys(this.stations).filter((k) => this.stations[k].lines.some((L) => ids.includes(L.id)));
      setLine(ids, near); showTip(id);
    };
    Object.keys(this.stations).forEach((id) => {
      const g = this.stations[id].g;
      g.addEventListener("pointerenter", () => focusStation(id));
      g.addEventListener("pointerleave", () => focusStation(null));
      g.addEventListener("focus", () => focusStation(id));
      g.addEventListener("blur", () => focusStation(null));
    });
    this.legends = [...this.rootRef.current.querySelectorAll("[data-legend]")];
    this.legends.forEach((b) => {
      const id = b.dataset.legend;
      const on = () => {
        const near = Object.keys(this.stations).filter((k) => this.stations[k].lines.some((L) => L.id === id));
        setLine([id], near); showTip(null);
        const meta = b.querySelector("[data-legend-meta]"); if (meta) meta.style.opacity = "1";
      };
      const off = () => { setLine(null); const meta = b.querySelector("[data-legend-meta]"); if (meta) meta.style.opacity = "0"; };
      b.addEventListener("pointerenter", on); b.addEventListener("focus", on);
      b.addEventListener("pointerleave", off); b.addEventListener("blur", off);
      b.addEventListener("click", () => { if (b.getAttribute("aria-pressed") === "true") off(); else on(); });
    });
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("scroll", this.onScroll);
    if (this.io) this.io.disconnect();
  }
}
</script>
</body>
</html>
