  constructor(props) {
    super(props);
    ["hostRef","stageRef","svgRef","modRef","dotRef","descRef"].forEach(k => { this[k] = React.createRef(); });
    this.m = { x: 0, y: 0, tx: 0, ty: 0 };
    this.active = null;
  }

  renderVals() {
    return { hostRef: this.hostRef, stageRef: this.stageRef, svgRef: this.svgRef,
             modRef: this.modRef, dotRef: this.dotRef, descRef: this.descRef };
  }

  componentDidMount() {
    const host = this.hostRef.current;
    if (!host) return;
    this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.small = window.matchMedia("(max-width: 860px)").matches;
    this.tiny = window.matchMedia("(max-width: 420px)").matches;
    // rotation crosses the breakpoint: the board must be rebuilt in the other layout,
    // or a rotated phone keeps a 5-across grid that no longer fits
    this.syncBreak = () => {
      const s = window.matchMedia("(max-width: 860px)").matches;
      const t = window.matchMedia("(max-width: 420px)").matches;
      const h = this.hostRef.current;
      if (h) h.style.aspectRatio = t ? "10 / 15" : s ? "16 / 11" : "16 / 9.4";
      if (s === this.small && t === this.tiny) return;
      this.small = s; this.tiny = t;
      if (!this.mods) return;
      // reposition in place — cheaper and safer than a rebuild, and the link curves and
      // packets both read m.x / m.y so they follow automatically
      this.mods.forEach((m, i) => {
        m.x = t ? 17 + (i % 3) * 33 : MODULES[i].x;
        m.y = t ? 8 + Math.floor(i / 3) * 21 : MODULES[i].y;
        m.el.style.left = m.x + "%";
        m.el.style.top = m.y + "%";
        const svg = m.el.querySelector("svg");
        if (svg) {
          svg.setAttribute("width", t ? "56" : s ? "70" : "88");
          svg.setAttribute("height", t ? "37" : s ? "46" : "58");
        }
        if (m.label) {
          m.label.style.fontSize = t ? "8px" : s ? "8.5px" : "9.5px";
          m.label.style.letterSpacing = t ? ".08em" : s ? ".12em" : ".16em";
        }
      });
      (this.paths || []).forEach(p => {
        const A = p.A, B = p.B;
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
        const bow = 3.2 * (((A.i + B.i) % 2) ? 1 : -1);
        p.cx = mx + (-dy / len) * bow;
        p.cy = my + (dx / len) * bow;
        p.el.setAttribute("d", "M" + A.x + "," + A.y + " Q" + p.cx + "," + p.cy + " " + B.x + "," + B.y);
      });
    };
    window.addEventListener("resize", this.syncBreak);

    const ml = this.modRef.current;
    this.mods = MODULES.map((spec, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", spec.l);
      // machined instrument: brushed anodised body, recessed glass readout, engraved plate
      b.style.cssText = "position:absolute;left:" + spec.x + "%;top:" + spec.y + "%;display:flex;flex-direction:column;gap:9px;padding:9px 9px 8px;border:0;border-radius:12px;background:" + BODY_BG + ";box-shadow:" + SHADOW(false) + ";cursor:pointer;opacity:0;transform:translate(-50%,-50%) scale(.94);transform-style:preserve-3d;transition:opacity .8s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease,background .45s ease;will-change:transform";

      const screen = document.createElement("div");
      screen.style.cssText = "position:relative;border-radius:8px;padding:7px 8px 6px;overflow:hidden;background:radial-gradient(120% 140% at 30% 0%,rgba(30,40,48,0.96),rgba(9,13,17,0.98) 70%);box-shadow:0 1px 2px rgba(0,0,0,0.85) inset,0 0 0 1px rgba(0,0,0,0.55) inset,0 0 0 1.5px rgba(216,228,232,0.07)";
      const svgWrap = document.createElement("div");
      svgWrap.innerHTML = '<svg width="88" height="58" viewBox="0 0 36 24" fill="none" aria-hidden="true">' + spec.a + "</svg>";
      svgWrap.style.cssText = "position:relative;display:block;line-height:0";
      screen.appendChild(svgWrap);
      // glass: scanline grain, then a single raking highlight across the top-left corner
      const grain = document.createElement("div");
      grain.style.cssText = "position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.028) 0 1px,rgba(0,0,0,0) 1px 3px)";
      const gloss = document.createElement("div");
      gloss.style.cssText = "position:absolute;inset:0;pointer-events:none;background:linear-gradient(146deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.03) 22%,rgba(255,255,255,0) 46%),radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,0.55),rgba(0,0,0,0) 60%)";
      screen.appendChild(grain);
      screen.appendChild(gloss);

      const plate = document.createElement("div");
      plate.style.cssText = "display:flex;align-items:center;gap:7px;padding:0 3px";
      const led = document.createElement("span");
      led.style.cssText = "width:4px;height:4px;border-radius:50%;background:rgba(226,178,116,0.5);box-shadow:0 0 5px 1px rgba(226,178,116,0.22);transition:background .4s ease,box-shadow .4s ease;flex:none";
      const label = document.createElement("span");
      label.textContent = spec.l;
      // engraved: dark ink with a one-pixel light edge below, like etched aluminium
      label.style.cssText = "font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(238,236,228,0.86);text-shadow:0 1px 0 rgba(255,255,255,0.07),0 -1px 0 rgba(0,0,0,0.6);white-space:nowrap;transition:color .4s ease";
      plate.appendChild(led);
      plate.appendChild(label);

      b.appendChild(screen);
      b.appendChild(plate);
      b.__led = led;
      // on a phone fifteen instruments must still read: the readout shrinks and the
      // engraved plate loses its letter-spacing rather than the tiles overlapping
      if (this.tiny) {
        const svgEl = svgWrap.querySelector("svg");
        if (svgEl) { svgEl.setAttribute("width", "56"); svgEl.setAttribute("height", "37"); }
        b.style.padding = "6px 6px 5px";
        b.style.gap = "6px";
        screen.style.padding = "5px 5px 4px";
        label.style.fontSize = "8px";
        label.style.letterSpacing = ".08em";
        led.style.width = "3px";
        led.style.height = "3px";
        plate.style.gap = "5px";
      } else if (this.small) {
        const svgEl = svgWrap.querySelector("svg");
        if (svgEl) { svgEl.setAttribute("width", "70"); svgEl.setAttribute("height", "46"); }
        b.style.padding = "7px 7px 6px";
        label.style.fontSize = "8.5px";
        label.style.letterSpacing = ".12em";
      }
      // A 5-across board cannot hold 15 instruments at phone width — the column pitch
      // falls below the plate width and they collide. On a phone the same board is
      // re-laid as 3 across by 5 down, in the same reading order.
      let px = spec.x, py = spec.y;
      if (this.tiny) {
        px = 17 + (i % 3) * 33;
        py = 8 + Math.floor(i / 3) * 21;
        b.style.left = px + "%";
        b.style.top = py + "%";
      }
      ml.appendChild(b);
      const anims = [...b.querySelectorAll("[style*='animation']")];
      // x/y are overridden, not shadowed: the link curves and packets read these
      return { ...spec, x: px, y: py, el: b, label, anims, i, on: 0 };
    });
    this.byId = {};
    this.mods.forEach(m => { this.byId[m.id] = m; });

    // neighbours light up with the module they work with
    this.nbrs = {};
    EDGES.forEach(([a, b]) => {
      (this.nbrs[a] = this.nbrs[a] || []).push(b);
      (this.nbrs[b] = this.nbrs[b] || []).push(a);
    });

    const svg = this.svgRef.current;
    this.paths = EDGES.map(([a, b]) => {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const A = this.byId[a], B = this.byId[b];
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const bow = 3.2 * (((A.i + B.i) % 2) ? 1 : -1);
      const cx = mx + (-dy / len) * bow, cy = my + (dx / len) * bow;
      p.setAttribute("d", "M" + A.x + "," + A.y + " Q" + cx + "," + cy + " " + B.x + "," + B.y);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "url(#tsLink)");
      p.setAttribute("stroke-width", "1.2");
      p.setAttribute("vector-effect", "non-scaling-stroke");
      p.style.opacity = "0";
      p.style.transition = "opacity .5s ease, stroke-width .4s ease";
      svg.appendChild(p);
      return { el: p, a, b, A, B, cx, cy };
    });

    // signals: sparse traffic across the graph, faster on the edges you are looking at
    const dl = this.dotRef.current;
    this.dots = this.paths.map((pathObj, i) => {
      const d = document.createElement("div");
      d.style.cssText = "position:absolute;left:0;top:0;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#f2ece0;box-shadow:0 0 8px 2px rgba(242,236,224,0.24);opacity:0;will-change:transform";
      dl.appendChild(d);
      return { el: d, path: pathObj, phase: (i * 0.173) % 1, speed: 0.055 + (i % 5) * 0.012 };
    });

    const setActive = (id) => {
      if (this.active === id) return;
      this.active = id;
      const near = id ? new Set([id].concat(this.nbrs[id] || [])) : null;
      this.mods.forEach((m) => {
        const isOn = !near || near.has(m.id);
        const isMe = m.id === id;
        m.el.style.opacity = String(m.shown ? (isOn ? 1 : 0.32) : 0);
        m.el.style.background = isMe ? BODY_BG_ON : BODY_BG;
        m.el.style.boxShadow = SHADOW(isMe);
        if (m.el.__led) {
          m.el.__led.style.background = isMe ? "rgba(238,196,132,0.98)" : "rgba(226,178,116,0.5)";
          m.el.__led.style.boxShadow = isMe ? "0 0 8px 2px rgba(226,178,116,0.5)" : "0 0 5px 1px rgba(226,178,116,0.22)";
        }
        m.label.style.color = isMe ? "#ffffff" : "rgba(244,240,230,0.9)";
        // idle modules keep ticking, just slower than the one under the cursor
        const rate = !id ? "1" : isMe ? "1" : isOn ? "0.8" : "0.35";
        if (m.rate !== rate) {
          m.rate = rate;
          m.anims.forEach((el) => { el.style.animationPlayState = "running"; });
          m.el.style.setProperty("--rate", rate);
        }
      });
      this.paths.forEach((p) => {
        const hot = id && (p.a === id || p.b === id);
        p.el.style.strokeWidth = hot ? "1.9" : "1.2";
        p.hot = hot;
      });
      const dr = this.descRef.current;
      if (dr) {
        dr.textContent = id ? this.byId[id].d : "what I combine to build real systems";
        dr.style.color = id ? "rgba(226,178,116,0.92)" : "rgba(226,178,116,0.82)";
      }
    };
    this.setActive = setActive;

    this.mods.forEach((m) => {
      m.el.addEventListener("pointerenter", () => setActive(m.id));
      m.el.addEventListener("focus", () => setActive(m.id));
      m.el.addEventListener("pointerleave", () => setActive(null));
      m.el.addEventListener("blur", () => setActive(null));
      m.el.addEventListener("click", () => setActive(this.active === m.id ? null : m.id));
    });

    this.onScroll = () => {
      const r = host.getBoundingClientRect();
      const vh = window.innerHeight;
      this.p = Math.min(1, Math.max(0, (vh * 0.88 - r.top) / (r.height * 0.6 + vh * 0.25)));
      const revs = host.parentElement ? host.parentElement.querySelectorAll("[data-ts-rev]") : [];
      revs.forEach((el) => { if (this.p > 0.04) { el.style.opacity = "1"; el.style.transform = "none"; } });
      // assembly: modules arrive in dependency order rather than all at once
      this.mods.forEach((m, i) => {
        const at = 0.12 + i * 0.035;
        if (this.p > at && !m.shown) {
          m.shown = true;
          m.el.style.opacity = this.active && this.active !== m.id ? "0.32" : "1";
        }
      });
      this.exit = Math.max(0, Math.min(1, (vh * 0.3 - r.bottom) / (vh * 0.55)));
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onScroll();

    this.onMove = (e) => {
      if (this.reduced || this.small) return;
      const r = host.getBoundingClientRect();
      this.m.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      this.m.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    window.addEventListener("pointermove", this.onMove, { passive: true });

    // offscreen the whole workspace stops: no CSS animation, no rAF, no cost
    this.live = true;
    if ("IntersectionObserver" in window) {
      this.io = new IntersectionObserver((en) => {
        this.live = en[0].isIntersecting;
        const st = this.live ? "running" : "paused";
        this.mods.forEach(m => m.anims.forEach(el => { el.style.animationPlayState = st; }));
      }, { rootMargin: "16% 0px" });
      this.io.observe(host);
    }

    this.t0 = performance.now();
    this.frame();
    if (!this.reduced) {
      const tick = () => { this.raf = requestAnimationFrame(tick); if (this.live) this.frame(); };
      tick();
    }
  }

  frame() {
    const t = (performance.now() - this.t0) / 1000;
    const exit = 1 - (this.exit || 0);

    this.m.x += (this.m.tx - this.m.x) * 0.04;
    this.m.y += (this.m.ty - this.m.y) * 0.04;
    const st = this.stageRef.current;
    if (st) st.style.transform = "rotateX(" + (-this.m.y * 1.8).toFixed(2) + "deg) rotateY(" + (this.m.x * 2.6).toFixed(2) + "deg)";

    this.mods.forEach((m) => {
      const par = 1 + m.z / 130;
      const drift = this.reduced ? 0 : Math.sin(t * 0.42 + m.i * 1.3) * 1.1;
      m.el.style.transform = "translate(-50%,-50%) translateZ(" + m.z + "px) translate3d(" +
        (-this.m.x * 7 * par).toFixed(2) + "px," + (drift - this.m.y * 5 * par).toFixed(2) + "px,0)";
      const soft = m.z < 0 ? -m.z / 55 : 0;
      const fl = soft > 0.05 ? "blur(" + (soft * 0.9).toFixed(2) + "px)" : "none";
      if (m.fl !== fl) { m.fl = fl; m.el.style.filter = fl; }
    });

    const rate = this.props.signalRate ?? 1;
    this.paths.forEach((p, i) => {
      const o = (p.A.shown && p.B.shown ? 1 : 0) * exit * (this.active ? (p.hot ? 1 : 0.3) : 0.75);
      const q = Math.round(o * 20) / 20;
      if (p.o !== q) { p.o = q; p.el.style.opacity = String(q); }
    });
    this.dots.forEach((d) => {
      const p = d.path;
      if (!p.A.shown || !p.B.shown) { if (d.el.style.opacity !== "0") d.el.style.opacity = "0"; return; }
      const hot = this.active ? (p.hot ? 1 : 0) : 1;
      const u = ((t * d.speed * rate * (p.hot ? 2.2 : 1) + d.phase) % 1 + 1) % 1;
      const iu = 1 - u;
      const x = iu * iu * p.A.x + 2 * iu * u * p.cx + u * u * p.B.x;
      const y = iu * iu * p.A.y + 2 * iu * u * p.cy + u * u * p.B.y;
      d.el.style.left = x.toFixed(3) + "%";
      d.el.style.top = y.toFixed(3) + "%";
      d.el.style.opacity = String(Math.sin(Math.PI * u) * (this.active ? hot * 0.95 : 0.5) * exit);
    });
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("pointermove", this.onMove);
    if (this.io) this.io.disconnect();
  }
}

</script>
</body>
</html>
