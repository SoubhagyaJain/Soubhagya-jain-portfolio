const POOL = 8;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    ["hostRef","stageRef","svgRef","nodeRef","dotRef","extraRef","viewRef","noteRef","shadowRef"].forEach(k => { this[k] = React.createRef(); });
    this.m = { x: 0, y: 0, tx: 0, ty: 0 };
    this.view = "idle";
  }

  renderVals() {
    return { hostRef: this.hostRef, stageRef: this.stageRef, svgRef: this.svgRef, nodeRef: this.nodeRef,
             dotRef: this.dotRef, extraRef: this.extraRef, viewRef: this.viewRef, noteRef: this.noteRef,
             shadowRef: this.shadowRef };
  }

  componentDidMount() {
    const host = this.hostRef.current;
    if (!host) return;
    this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.small = window.matchMedia("(max-width: 860px)").matches;

    // ── the node pool: built once, relabelled and repositioned forever after
    const nl = this.nodeRef.current;
    this.nodes = [];
    for (let i = 0; i < POOL; i++) {
      const el = document.createElement("div");
      el.style.cssText = "position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform;opacity:0;transition:opacity .55s ease";
      const plate = document.createElement("div");
      plate.style.cssText = "display:block;white-space:nowrap;border-radius:9px;font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;transition:padding .6s cubic-bezier(.2,.7,.2,1),font-size .6s ease,background .6s ease,box-shadow .6s ease,color .6s ease";
      el.appendChild(plate);
      nl.appendChild(el);
      // each module casts a soft contact shadow on the instrument floor
      const sh = document.createElement("div");
      sh.style.cssText = "position:absolute;left:0;top:0;width:96px;height:18px;margin:-9px 0 0 -48px;border-radius:50%;background:radial-gradient(closest-side,rgba(2,5,8,0.6),rgba(2,5,8,0));opacity:0;will-change:transform";
      this.shadowRef.current.appendChild(sh);
      this.nodes.push({ el, plate, sh, x: 50, y: 50, z: 0, tx: 50, ty: 50, tz: 0, on: 0, ton: 0, kind: "", label: "" });
    }

    // ── links: one reusable path per possible edge
    const svg = this.svgRef.current;
    this.paths = [];
    for (let i = 0; i < 12; i++) {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "url(#areaLink)");
      p.setAttribute("stroke-width", "1.4");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("vector-effect", "non-scaling-stroke");
      p.style.transition = "opacity .5s ease";
      p.style.opacity = "0";
      svg.appendChild(p);
      this.paths.push(p);
    }

    // ── packets: the only things that ever move on their own
    const dl = this.dotRef.current;
    this.dots = [];
    for (let i = 0; i < 16; i++) {
      const d = document.createElement("div");
      d.style.cssText = "position:absolute;left:0;top:0;width:5.5px;height:5.5px;margin:-2.75px 0 0 -2.75px;border-radius:50%;background:#f2ece0;box-shadow:0 0 8px 2px rgba(242,236,224,0.28);opacity:0;will-change:transform";
      dl.appendChild(d);
      this.dots.push({ el: d, phase: (i * 0.137) % 1 });
    }

    // ── the reranking micro-interaction: chunks that physically reorder
    const ex = this.extraRef.current;
    this.chunks = [];
    for (let i = 0; i < 5; i++) {
      const c = document.createElement("div");
      c.style.cssText = "position:absolute;left:0;top:0;height:4px;border-radius:2px;background:rgba(242,236,224,0.55);opacity:0;transition:opacity .5s ease,width .7s cubic-bezier(.2,.7,.2,1),background .6s ease;will-change:transform";
      ex.appendChild(c);
      this.chunks.push({ el: c, y: 0, ty: 0, score: Math.random() });
    }

    this.apply("idle", true);

    // ── hover, focus and tap all drive the same state
    const buttons = [...(host.parentElement ? host.parentElement.querySelectorAll("[data-area]") : [])];
    this.buttons = buttons;
    const set = (v) => this.apply(v);
    buttons.forEach((b) => {
      const id = b.dataset.area;
      b.addEventListener("pointerenter", () => set(id));
      b.addEventListener("focus", () => set(id));
      b.addEventListener("click", () => set(this.view === id ? "idle" : id));
      b.addEventListener("pointerleave", () => { if (!this.sticky) set("idle"); });
      b.addEventListener("blur", () => { if (!this.sticky) set("idle"); });
    });

    this.onScroll = () => {
      const r = host.getBoundingClientRect();
      const vh = window.innerHeight;
      const p = Math.min(1, Math.max(0, (vh * 0.85 - r.top) / (r.height * 0.7 + vh * 0.2)));
      this.p = p;
      // entrance: eyebrow, then the disciplines, then the system assembles
      const revs = host.parentElement ? host.parentElement.querySelectorAll("[data-area-rev]") : [];
      revs.forEach((el) => {
        const i = parseInt(el.dataset.areaRev, 10) || 0;
        if (p > 0.06 + i * 0.045) { el.style.opacity = "1"; el.style.transform = "none"; }
      });
      this.assembled = p > 0.4;
      // exit: the system reduces to one travelling signal
      this.exit = Math.min(1, Math.max(0, (r.bottom - vh * 0.35) < 0 ? (vh * 0.35 - r.bottom) / (vh * 0.5) : 0));
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onScroll();

    this.onMove = (e) => {
      if (this.reduced || this.small) return;
      const r = host.getBoundingClientRect();
      this.m.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      this.m.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    window.addEventListener("pointermove", this.onMove, { passive: true });

    this.live = true;
    if ("IntersectionObserver" in window) {
      this.io = new IntersectionObserver((en) => { this.live = en[0].isIntersecting; }, { rootMargin: "18% 0px" });
      this.io.observe(host);
    }

    this.t0 = performance.now();
    this.frame();
    if (!this.reduced) {
      const tick = () => { this.raf = requestAnimationFrame(tick); if (this.live) this.frame(); };
      tick();
    }
  }

  // assign the pool to a view — same objects, new roles
  apply(view, immediate) {
    if (this.view === view && !immediate) return;
    this.view = view;
    const V = VIEWS[view];
    const seen = new Set();
    V.nodes.forEach((spec) => {
      const n = this.nodes[spec.i];
      if (!n) return;
      seen.add(spec.i);
      n.tx = spec.x; n.ty = spec.y; n.tz = spec.z; n.ton = 1;
      const kind = spec.t === "c" || spec.t === "core" ? "core" : spec.t === "m" ? "micro" : "node";
      const label = spec.l || "";
      if (n.kind !== kind || n.label !== label) {
        n.kind = kind; n.label = label;
        n.plate.textContent = label;
        const BASE = "display:block;white-space:nowrap;border-radius:9px;font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;transition:padding .6s cubic-bezier(.2,.7,.2,1),font-size .6s ease,background .6s ease,box-shadow .6s ease,color .6s ease;";
        const SKIN = kind === "core"
          ? "padding:16px 19px;font-size:12.5px;color:rgba(246,241,230,0.99);background:linear-gradient(180deg,rgba(40,46,53,0.94),rgba(19,24,29,0.94));box-shadow:0 1px 0 rgba(255,255,255,0.18) inset,0 -1px 0 rgba(255,255,255,0.06) inset,0 0 0 1px rgba(226,178,116,0.32),0 36px 54px -30px rgba(0,0,0,0.96),0 8px 18px -12px rgba(0,0,0,0.7)"
          : kind === "micro"
          ? "padding:7px 11px;font-size:10px;color:rgba(232,240,232,0.62);background:rgba(18,23,28,0.6);box-shadow:0 0 0 1px rgba(216,228,232,0.08)"
          : "padding:13px 16px;font-size:11.5px;color:rgba(244,240,230,0.92);background:linear-gradient(180deg,rgba(31,37,43,0.9),rgba(16,21,26,0.92));box-shadow:0 1px 0 rgba(255,255,255,0.14) inset,0 -1px 0 rgba(255,255,255,0.05) inset,0 0 0 1px rgba(216,228,232,0.13),0 30px 46px -28px rgba(0,0,0,0.95),0 6px 14px -10px rgba(0,0,0,0.68)";
        // an unlabelled pool member is a bare structural dot, not an empty plate
        n.plate.style.cssText = BASE + (label ? SKIN : "width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 34% 30%, #ffffff, #cfd6d2 60%, #8e9793);box-shadow:0 0 11px 2px rgba(242,236,224,0.2),0 4px 8px -4px rgba(0,0,0,0.8)");
      }
    });
    // unused pool members retire toward the core rather than vanishing on the spot
    this.nodes.forEach((n, i) => {
      if (seen.has(i)) return;
      n.ton = 0; n.tx = 50; n.ty = 50; n.tz = -60;
    });

    const vr = this.viewRef.current, nr = this.noteRef.current;
    if (vr) vr.textContent = V.label;
    if (nr) nr.textContent = V.note;

    this.buttons && this.buttons.forEach((b) => {
      const on = b.dataset.area === view;
      const title = b.querySelector("[data-area-title]"), sub = b.querySelector("[data-area-sub]");
      b.style.transform = on ? "translateX(7px)" : "none";
      b.style.opacity = view === "idle" || on ? "1" : "0.55";
      if (title) title.style.color = on ? "#ffffff" : "rgba(244,249,242,0.9)";
      if (sub) sub.style.color = on ? "rgba(226,178,116,0.92)" : "rgba(232,240,232,0.44)";
    });

    if (immediate) this.nodes.forEach((n) => { n.x = n.tx; n.y = n.ty; n.z = n.tz; n.on = n.ton; });
  }

  frame() {
    const t = (performance.now() - this.t0) / 1000;
    const V = VIEWS[this.view];
    const k = this.reduced ? 1 : 0.075;
    const asm = this.assembled || this.reduced ? 1 : 0;
    const exit = 1 - (this.exit || 0);

    this.m.x += (this.m.tx - this.m.x) * 0.04;
    this.m.y += (this.m.ty - this.m.y) * 0.04;
    const st = this.stageRef.current;
    if (st) st.style.transform = "rotateX(" + (-this.m.y * 2).toFixed(2) + "deg) rotateY(" + (this.m.x * 3).toFixed(2) + "deg)";

    // nodes ease toward their role in the current view
    this.nodes.forEach((n, i) => {
      n.x += (n.tx - n.x) * k; n.y += (n.ty - n.y) * k; n.z += (n.tz - n.z) * k;
      n.on += (n.ton - n.on) * 0.09;
      const breathe = this.reduced ? 0 : Math.sin(t * 0.5 + i * 1.7) * 0.22;
      const par = 1 + n.z / 120;
      n.el.style.left = (n.x + breathe * 0.4).toFixed(3) + "%";
      n.el.style.top = (n.y + breathe).toFixed(3) + "%";
      n.el.style.transform = "translate(-50%,-50%) translateZ(" + n.z.toFixed(1) + "px) translate3d(" +
        (-this.m.x * 6 * par).toFixed(2) + "px," + (-this.m.y * 4 * par).toFixed(2) + "px,0)";
      const o = n.on * asm * exit;
      const q = Math.round(o * 30) / 30;
      if (n.o !== q) { n.o = q; n.el.style.opacity = String(q); }
      if (n.sh) {
        // the shadow sits below the module and spreads with its height off the floor
        const lift = 1 + n.z / 160;
        n.sh.style.left = (n.x + breathe * 0.4).toFixed(3) + "%";
        n.sh.style.top = (n.y + breathe + 3.4).toFixed(3) + "%";
        n.sh.style.transform = "scale(" + lift.toFixed(3) + "," + (1 / lift).toFixed(3) + ")";
        const so = Math.round(q * (n.kind === "micro" ? 0.35 : 0.75) * 20) / 20;
        if (n.so !== so) { n.so = so; n.sh.style.opacity = String(so); }
      }
      const soft = n.z < 0 ? -n.z / 60 : 0;
      const fl = soft > 0.05 ? "blur(" + (soft * 1.1).toFixed(2) + "px)" : "none";
      if (n.fl !== fl) { n.fl = fl; n.el.style.filter = fl; }
    });

    // links redrawn from live node positions — the structure follows the nodes
    const bez = (a, b, bow, u) => {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const cx = mx + (-dy / len) * (bow || 0), cy = my + (dx / len) * (bow || 0);
      const iu = 1 - u;
      return { x: iu * iu * a.x + 2 * iu * u * cx + u * u * b.x, y: iu * iu * a.y + 2 * iu * u * cy + u * u * b.y, cx, cy };
    };
    this.paths.forEach((p, i) => {
      const L = V.links[i];
      if (!L) { if (p.style.opacity !== "0") p.style.opacity = "0"; return; }
      const a = this.nodes[L[0]], b = this.nodes[L[1]];
      const c = bez(a, b, L[2], 0.5);
      p.setAttribute("d", "M" + a.x.toFixed(2) + "," + a.y.toFixed(2) + " Q" + c.cx.toFixed(2) + "," + c.cy.toFixed(2) + " " + b.x.toFixed(2) + "," + b.y.toFixed(2));
      const o = Math.min(a.on, b.on) * asm * exit;
      const q = Math.round(o * 20) / 20;
      if (p.o !== q) { p.o = q; p.style.opacity = String(q); }
    });

    // packets: one per declared flow, brightening where the work happens
    const rate = this.props.signalRate ?? 1;
    this.dots.forEach((d, i) => {
      const F = V.flow[i];
      if (!F || !asm) { if (d.el.style.opacity !== "0") d.el.style.opacity = "0"; return; }
      const a = this.nodes[F[0]], b = this.nodes[F[1]];
      let u = ((t * (F[2] || 0.15) * rate + d.phase) % 1 + 1) % 1;
      if (F[3]) u = 1 - u;                       // return traffic: telemetry, tool results, health
      const link = V.links.find(L => L[0] === F[0] && L[1] === F[1]);
      const pt = bez(a, b, link ? (link[2] || 0) : 0, u);
      d.el.style.left = pt.x.toFixed(3) + "%";
      d.el.style.top = pt.y.toFixed(3) + "%";
      const warm = F[3] ? "#9fb6c4" : "#f2ece0";  // returning signals read cooler than requests
      if (d.c !== warm) { d.c = warm; d.el.style.background = warm; }
      d.el.style.opacity = String(Math.sin(Math.PI * u) * 0.95 * Math.min(a.on, b.on) * exit);
    });

    // the rerank moment: candidate chunks reorder by score, weak ones fade out
    const showChunks = this.view === "rag" && asm;
    const cycle = 6.5;
    const cp = (t % cycle) / cycle;
    this.chunks.forEach((c, i) => {
      if (!showChunks) { if (c.el.style.opacity !== "0") c.el.style.opacity = "0"; return; }
      if (cp < 0.06 && !c.rolled) { c.score = Math.random(); c.rolled = true; }
      if (cp > 0.5) c.rolled = false;
      const ranked = cp > 0.42;
      const order = ranked ? this.chunks.slice().sort((a, b) => b.score - a.score).indexOf(c) : i;
      c.ty = 60 + order * 5.4;
      c.y += (c.ty - c.y) * 0.09;
      const weak = ranked && c.score < 0.32;
      c.el.style.left = "20%";
      c.el.style.top = c.y.toFixed(2) + "%";
      c.el.style.width = (5 + c.score * 13).toFixed(1) + "%";
      c.el.style.background = weak ? "rgba(242,236,224,0.18)" : ranked ? "rgba(226,178,116,0.8)" : "rgba(242,236,224,0.5)";
      c.el.style.opacity = String((weak ? 0.25 : 0.95) * exit);
    });
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("pointermove", this.onMove);
    if (this.io) this.io.disconnect();
  }
}

</script>
</body>
</html>
