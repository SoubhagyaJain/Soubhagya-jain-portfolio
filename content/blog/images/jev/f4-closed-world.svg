<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" aria-hidden="true" focusable="false"><defs><marker id="f4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="f4-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="ghost" x="20" y="130" width="230" height="100" rx="10"/><text class="th" x="40" y="166" text-anchor="start">An input none of</text><text class="th" x="40" y="188" text-anchor="start">the categories describe</text><text class="m" x="40" y="214" text-anchor="start">outside the answer space</text><rect class="box" x="420" y="40" width="200" height="70" rx="8"/><text class="v" x="520" y="82" text-anchor="middle">billing</text><rect class="box" x="420" y="146" width="200" height="70" rx="8"/><text class="v" x="520" y="188" text-anchor="middle">technical</text><rect class="ghost" x="420" y="262" width="200" height="70" rx="8"/><text class="v" x="520" y="296" text-anchor="middle">none_of_these</text><text class="m" x="520" y="318" text-anchor="middle">the escape hatch</text><path class="acc" d="M252,160 C330,150 350,80 414,76" marker-end="url(#f4-b)"/><text class="ma" x="20" y="96" text-anchor="start">forced into the least-wrong</text><text class="ma" x="20" y="112" text-anchor="start">valid option</text><path class="dash" d="M252,212 C330,230 350,296 414,296" marker-end="url(#f4-a)"/><text class="m" x="20" y="262" text-anchor="start">only if the schema</text><text class="m" x="20" y="278" text-anchor="start">offers a way out</text><rect class="hl" x="660" y="40" width="320" height="100" rx="10"/><text class="th" x="680" y="72" text-anchor="start">Valid · confident · wrong</text><text class="t" x="680" y="96" text-anchor="start">No malformed output. The type</text><text class="t" x="680" y="116" text-anchor="start">system did its job; the answer space didn't.</text><line class="grid" x1="620" y1="76" x2="660" y2="76"/><text class="t" x="660" y="190" text-anchor="start">Independent evaluation, no escape hatch:</text><text class="ts" x="660" y="220" text-anchor="start">0 of 30</text><text class="t" x="760" y="220" text-anchor="start">out-of-scope messages</text><text class="t" x="760" y="238" text-anchor="start">rejected, even at a 0.99 gate</text></svg>
