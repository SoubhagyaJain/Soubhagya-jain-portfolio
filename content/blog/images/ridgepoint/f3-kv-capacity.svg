<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" aria-hidden="true" focusable="false"><defs><marker id="rp3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp3-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="th" x="20" y="36" text-anchor="start">Tokens of context that fit in 1 GiB of KV cache</text><text class="th" x="20" y="102" text-anchor="start">Qwen2.5-1.5B</text><text class="m" x="20" y="124" text-anchor="start">28 KiB / token</text><g><title>Qwen2.5-1.5B: about 37,449 tokens</title><rect class="accf" x="250" y="86" width="640.0" height="26" rx="3"/></g><text class="v" x="902.0" y="106" text-anchor="start">≈37,449</text><text class="m" x="250" y="140" text-anchor="start">2 × 28 layers × 2 KV heads × 128 dims × 2 bytes</text><text class="th" x="20" y="212" text-anchor="start">Qwen3-1.7B</text><text class="m" x="20" y="234" text-anchor="start">112 KiB / token</text><g><title>Qwen3-1.7B: about 9,362 tokens</title><rect class="dimf" x="250" y="196" width="160.0" height="26" rx="3"/></g><text class="v" x="422.0" y="216" text-anchor="start">≈9,362</text><text class="m" x="250" y="250" text-anchor="start">≈4× the KV bytes per token</text><line class="rule" x1="250" y1="60" x2="250" y2="300"/><text class="m" x="20" y="316" text-anchor="start">Similar weight bytes, a 4× gap in how many tokens — and so how many concurrent sequences — the same memory holds</text></svg>