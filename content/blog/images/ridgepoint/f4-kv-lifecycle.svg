<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" aria-hidden="true" focusable="false"><defs><marker id="rp4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp4-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="th" x="20" y="36" text-anchor="start">Block tables</text><text class="m" x="20" y="76" text-anchor="start">seq A</text><text class="m" x="20" y="136" text-anchor="start">seq B</text><rect class="hl" x="80" y="54" width="56" height="36" rx="5"/><text class="v" x="108" y="77" text-anchor="middle">b3</text><rect class="hl" x="144" y="54" width="56" height="36" rx="5"/><text class="v" x="172" y="77" text-anchor="middle">b7</text><rect class="box" x="208" y="54" width="56" height="36" rx="5"/><text class="v" x="236" y="77" text-anchor="middle">b9</text><rect class="hl" x="80" y="114" width="56" height="36" rx="5"/><text class="v" x="108" y="137" text-anchor="middle">b3</text><rect class="hl" x="144" y="114" width="56" height="36" rx="5"/><text class="v" x="172" y="137" text-anchor="middle">b7</text><rect class="box" x="208" y="114" width="56" height="36" rx="5"/><text class="v" x="236" y="137" text-anchor="middle">b12</text><text class="ma" x="20" y="186" text-anchor="start">b3, b7: one shared prefix, refcount 2</text><text class="m" x="20" y="206" text-anchor="start">found by chained hashes of full blocks</text><rect class="box" x="360" y="60" width="150" height="56" rx="8"/><text class="th" x="435" y="94" text-anchor="middle">free</text><rect class="box" x="540" y="60" width="150" height="56" rx="8"/><text class="th" x="615" y="94" text-anchor="middle">live</text><rect class="hl" x="820" y="60" width="150" height="56" rx="8"/><text class="th" x="895" y="94" text-anchor="middle">shared</text><rect class="hl" x="820" y="190" width="150" height="56" rx="8"/><text class="th" x="895" y="224" text-anchor="middle">evictable</text><rect class="box" x="540" y="190" width="150" height="56" rx="8"/><text class="th" x="615" y="224" text-anchor="middle">reclaimed</text><path class="ln" d="M512,88 L536,88" marker-end="url(#rp4-a)"/><path class="ln" d="M692,88 L816,88" marker-end="url(#rp4-a)"/><path class="ln" d="M895,118 L895,186" marker-end="url(#rp4-a)"/><path class="ln" d="M816,218 L692,218" marker-end="url(#rp4-a)"/><path class="ln" d="M540,218 C450,218 435,150 435,120" marker-end="url(#rp4-a)"/><text class="m" x="754" y="78" text-anchor="middle">prefix hit</text><text class="m" x="905" y="158" text-anchor="start">refcount → 0</text><text class="m" x="754" y="208" text-anchor="middle">LRU evict</text><text class="m" x="452" y="176" text-anchor="end">return</text><path class="accd" d="M880,248 C880,300 730,300 740,100"/><text class="ma" x="660" y="322" text-anchor="middle">a cache hit revives an evictable block before it is reclaimed</text><text class="t" x="20" y="280" text-anchor="start">Every evictable block holding a cached prefix</text><text class="t" x="20" y="300" text-anchor="start">is a block a live request cannot use.</text></svg>