<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" aria-hidden="true" focusable="false"><defs><marker id="rp1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp1-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><line class="rule" x1="110" y1="360" x2="960" y2="360"/><line class="rule" x1="110" y1="360" x2="110" y2="40"/><text class="m" x="960" y="394" text-anchor="end">arithmetic intensity (FLOPs per byte moved) →</text><text class="m" x="92" y="44" text-anchor="end" transform="rotate(-90 92 44)">attainable throughput →</text><path class="acc" d="M110,350 L560,110 L960,110"/><text class="ma" x="330" y="300" text-anchor="start">memory-bandwidth bound</text><text class="m" x="330" y="318" text-anchor="start">slope = bandwidth (≈192 GB/s est.)</text><text class="ma" x="960" y="96" text-anchor="end">compute bound</text><circle class="accf" cx="560" cy="110" r="6"/><text class="th" x="560" y="88" text-anchor="middle">the ridge point</text><line class="grid" x1="560" y1="110" x2="560" y2="360"/><g><title>decode, batch 1</title><circle class="inkf" cx="170" cy="318.0" r="6"/></g><text class="m" x="180" y="340.0" text-anchor="start">batch 1</text><g><title>decode, batch 4</title><circle class="inkf" cx="260" cy="270.0" r="6"/></g><text class="m" x="270" y="292.0" text-anchor="start">batch 4</text><g><title>decode, batch 16</title><circle class="inkf" cx="380" cy="206.0" r="6"/></g><text class="m" x="390" y="228.0" text-anchor="start">batch 16</text><text class="th" x="150" y="150" text-anchor="start">Decode</text><text class="t" x="150" y="172" text-anchor="start">one new token per sequence per step:</text><text class="t" x="150" y="190" text-anchor="start">almost every weight byte, little math</text><g><title>prefill, P = short</title><rect class="hl" x="464" y="152.0" width="12" height="12" rx="2"/></g><text class="m" x="470" y="188.0" text-anchor="middle">P = short</text><g><title>prefill, P = longer</title><rect class="hl" x="684" y="104" width="12" height="12" rx="2"/></g><text class="m" x="690" y="140" text-anchor="middle">P = longer</text><g><title>prefill, P = 2,000</title><rect class="hl" x="854" y="104" width="12" height="12" rx="2"/></g><text class="m" x="860" y="140" text-anchor="middle">P = 2,000</text><text class="th" x="700" y="200" text-anchor="start">Prefill</text><text class="t" x="700" y="222" text-anchor="start">FLOPs ≈ 2·N·P — wide activations,</text><text class="t" x="700" y="240" text-anchor="start">intensity grows with prompt length</text><text class="m" x="110" y="396" text-anchor="start">Conceptual — positions are qualitative, not measured</text></svg>