<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" aria-hidden="true" focusable="false"><defs><marker id="rp2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp2-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="20" y="150" width="110" height="70" rx="8"/><text class="th" x="75" y="190" text-anchor="middle">Client</text><path class="ln" d="M132,185 L166,185" marker-end="url(#rp2-a)"/><rect class="box" x="170" y="90" width="200" height="190" rx="8"/><text class="th" x="190" y="120" text-anchor="start">Frontend</text><text class="t" x="190" y="150" text-anchor="start">HTTP · validation</text><text class="t" x="190" y="174" text-anchor="start">tokenize / detokenize</text><text class="t" x="190" y="198" text-anchor="start">streaming</text><text class="t" x="190" y="222" text-anchor="start">disconnect detection</text><text class="ma" x="190" y="262" text-anchor="start">no GPU state</text><path class="ln" d="M372,185 L426,185" marker-end="url(#rp2-a)"/><text class="m" x="399" y="168" text-anchor="middle">IPC</text><text class="m" x="399" y="212" text-anchor="middle">token IDs</text><rect class="hl" x="430" y="30" width="550" height="330" rx="12"/><text class="th" x="452" y="60" text-anchor="start">Engine process — owns the GPU</text><text class="m" x="452" y="82" text-anchor="start">one thread mutates scheduler + KV state</text><rect class="box" x="452" y="110" width="150" height="62" rx="8"/><text class="t" x="527" y="147" text-anchor="middle">Scheduler</text><rect class="box" x="632" y="110" width="150" height="62" rx="8"/><text class="t" x="707" y="147" text-anchor="middle">KV cache manager</text><rect class="box" x="812" y="110" width="150" height="62" rx="8"/><text class="t" x="887" y="147" text-anchor="middle">Input builder</text><rect class="box" x="812" y="220" width="150" height="62" rx="8"/><text class="t" x="887" y="257" text-anchor="middle">Model runner</text><rect class="box" x="632" y="220" width="150" height="62" rx="8"/><text class="t" x="707" y="257" text-anchor="middle">Output processor</text><rect class="box" x="452" y="220" width="150" height="62" rx="8"/><text class="t" x="527" y="257" text-anchor="middle">Telemetry</text><path class="ln" d="M604,141 L628,141" marker-end="url(#rp2-a)"/><path class="ln" d="M784,141 L808,141" marker-end="url(#rp2-a)"/><path class="ln" d="M887,174 L887,216" marker-end="url(#rp2-a)"/><path class="ln" d="M810,251 L786,251" marker-end="url(#rp2-a)"/><path class="ln" d="M630,251 L606,251" marker-end="url(#rp2-a)"/><path class="dash" d="M527,284 C527,330 900,330 900,300"/><text class="m" x="705" y="346" text-anchor="middle">one loop per step · requests and aborts apply between steps</text></svg>