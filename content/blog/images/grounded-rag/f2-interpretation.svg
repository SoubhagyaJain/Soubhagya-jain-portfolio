<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" aria-hidden="true" focusable="false"><defs><marker id="gr2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gr2-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="20" y="150" width="170" height="70" rx="8"/><text class="th" x="105" y="180" text-anchor="middle">User turn</text><text class="t" x="105" y="202" text-anchor="middle">“does it apply…?”</text><path class="ln" d="M192,185 L226,185" marker-end="url(#gr2-a)"/><rect class="hl" x="230" y="110" width="250" height="150" rx="10"/><text class="th" x="250" y="140" text-anchor="start">ConversationInterpretation</text><text class="v" x="250" y="170" text-anchor="start">standalone_query</text><text class="v" x="250" y="192" text-anchor="start">resolved_references</text><text class="v" x="250" y="214" text-anchor="start">topic_shift · is_followup</text><text class="v" x="250" y="236" text-anchor="start">retrieval_decision</text><path class="ln" d="M482,185 C540,185 540,56 596,56" marker-end="url(#gr2-a)"/><rect class="box" x="600" y="30" width="250" height="52" rx="8"/><text class="v" x="616" y="53" text-anchor="start">RETRIEVE</text><text class="m" x="616" y="72" text-anchor="start">full pipeline</text><text class="m" x="980" y="62" text-anchor="end">searches</text><path class="ln" d="M482,185 C540,185 540,122 596,122" marker-end="url(#gr2-a)"/><rect class="box" x="600" y="96" width="250" height="52" rx="8"/><text class="v" x="616" y="119" text-anchor="start">REUSE_PREVIOUS</text><text class="m" x="616" y="138" text-anchor="start">reuses verified evidence</text><text class="ma" x="980" y="128" text-anchor="end">no search</text><path class="ln" d="M482,185 C540,185 540,188 596,188" marker-end="url(#gr2-a)"/><rect class="box" x="600" y="162" width="250" height="52" rx="8"/><text class="v" x="616" y="185" text-anchor="start">DECOMPOSE</text><text class="m" x="616" y="204" text-anchor="start">one retrieval per part</text><text class="m" x="980" y="194" text-anchor="end">searches</text><path class="ln" d="M482,185 C540,185 540,254 596,254" marker-end="url(#gr2-a)"/><rect class="box" x="600" y="228" width="250" height="52" rx="8"/><text class="v" x="616" y="251" text-anchor="start">ASK_CLARIFICATION</text><text class="m" x="616" y="270" text-anchor="start">no retrieval</text><text class="ma" x="980" y="260" text-anchor="end">no search</text><path class="ln" d="M482,185 C540,185 540,320 596,320" marker-end="url(#gr2-a)"/><rect class="box" x="600" y="294" width="250" height="52" rx="8"/><text class="v" x="616" y="317" text-anchor="start">NO_RETRIEVAL</text><text class="m" x="616" y="336" text-anchor="start">greetings, meta</text><text class="ma" x="980" y="326" text-anchor="end">no search</text><text class="t" x="20" y="372" text-anchor="start">The retriever only ever sees standalone_query. Assistant prose is never evidence.</text></svg>